<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfoTickets</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<h1>InfoTickets</h1>

<p>
Sistema de gerenciamento e inscrições em eventos.
</p>

<!-- formulário -->

<input id="nome" placeholder="Nome do evento">

<input id="descricao" placeholder="Descrição">

<input id="local" placeholder="Local">

<input id="data" placeholder="Data">

<!-- botões -->

<button onclick="salvarEvento()">
Cadastrar Evento
</button>

<button onclick="listarEventos()">
Listar Eventos
</button>

<!-- resultado -->

<div id="resultado"></div>

<script src="script.js"></script>

</body>
</html>
